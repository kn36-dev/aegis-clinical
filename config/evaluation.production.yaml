# Production AEGIS evaluation configuration.
#
# NOT CI-safe -- requires the same real infrastructure the running
# application needs:
#   - UPSTASH_VECTOR_REST_URL / UPSTASH_VECTOR_REST_TOKEN (real semantic
#     retrieval against the production ICD-11 index, not the small
#     evaluation fixture)
#   - AEGIS_PROFILE=production (or integration) and GROQ_API_KEY, for
#     reasoning evaluation to exercise the real CrewAIReasoningProvider
#     instead of the demo profile's deterministic provider
#
# No separate credential story is invented here -- these are exactly the
# same env vars aegis.config.AppSettings already requires to run the app
# itself. Kept as a distinct file (not a single `mode` flag flipped in
# config/evaluation.yaml) so switching to production evaluation is a
# deliberate, visible choice, and so CI never accidentally picks it up.

dataset_path: evals/clinical_cases.jsonl
output_dir: .artifacts/evaluations

retrieval:
  mode: production
  top_k_values: [1, 3, 5]
  similarity_threshold: null
  # Unused in production mode; retained so this file is a complete,
  # valid EvaluationConfig on its own.
  local_fixture_csv: data/eval_icd_fixture.csv

reasoning:
  reasoning_model: null

rate_limit:
  requests_per_minute: 25
  requests_per_hour: 500
  requests_per_day: 5000
  tokens_per_minute: null
  tokens_per_day: null
  max_retries: 5
  initial_backoff_seconds: 1.0
  backoff_multiplier: 2.0
