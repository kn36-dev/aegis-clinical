# Default AEGIS evaluation configuration -- CI-safe.
#
# retrieval.mode: local means no external credentials are required:
# retrieval runs against the small, hand-curated fixture index described
# in data/eval_icd_fixture.README.md, not the real production taxonomy.
#
# reasoning evaluation still respects AEGIS_PROFILE from .env: leave it
# at "demo" (the repository default profile for a fresh checkout) to run
# reasoning evaluation with zero external LLM calls via the deterministic
# top-candidate provider. Set AEGIS_PROFILE=production (and GROQ_API_KEY)
# to evaluate the real Groq/CrewAI reasoning pass.
#
# For a full production run (real Upstash Vector retrieval + real Groq
# reasoning), use config/evaluation.production.yaml instead -- do not
# just flip `mode` here for that; the two are kept as separate files so
# switching to production is a deliberate, visible choice.

dataset_path: evals/clinical_cases.jsonl
output_dir: .artifacts/evaluations

retrieval:
  mode: local
  top_k_values: [1, 3, 5]
  similarity_threshold: null
  local_fixture_csv: data/eval_icd_fixture.csv
  # Built directly via SentenceTransformersEmbeddingProvider -- local mode
  # never reads aegis.config.AppSettings (which unconditionally requires
  # Upstash Vector credentials), so this is the only embedding-model knob
  # for local/CI runs.
  local_embedding_model: BAAI/bge-large-en-v1.5

reasoning:
  # Informational only -- recorded on the report. Actual provider
  # selection always comes from AEGIS_PROFILE/.env, never from here.
  reasoning_model: null

rate_limit:
  # Conservative defaults sized for Groq's free tier. Only enforced when
  # reasoning evaluation is actually hitting the real CrewAIReasoningProvider
  # (AEGIS_PROFILE=production/integration) -- a no-op under the demo profile.
  requests_per_minute: 25
  requests_per_hour: 500
  requests_per_day: 5000
  # Token-based limits: interface only today, not yet enforced -- see
  # aegis.evaluation.rate_limiter's module docstring.
  tokens_per_minute: null
  tokens_per_day: null
  max_retries: 5
  initial_backoff_seconds: 1.0
  backoff_multiplier: 2.0
