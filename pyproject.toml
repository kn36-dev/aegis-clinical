[project]
name = "aegis-clinical"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "crewai>=1.14.7",
    "en-core-web-sm",
    "fastapi>=0.136.3",
    "langchain>=1.3.9",
    "langgraph>=1.2.5",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "litellm>=1.92.0",
    "nltk>=3.9.4",
    "presidio-analyzer>=2.2.363",
    "presidio-anonymizer>=2.2.363",
    "pydantic-ai>=1.31.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.0",
    "spacy>=3.8.13",
    "upstash-redis>=1.7.0",
    "upstash-vector>=0.8.0",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.155.2",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "ASYNC", "TCH"]
extend-ignore = ["B008"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "aegis.models.base.DomainModel",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["frontend/"]

[tool.pyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:crewai.*",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "aegis"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
aegis-db = "aegis.database.cli:main"
